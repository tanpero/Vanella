[package]
name = "rust_addon"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_addon"
crate-type = ["cdylib"]

[dependencies]
napi = "2"
napi-derive = "2"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
napi-build = "2"
